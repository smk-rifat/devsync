services:
  postgres:
    image: postgres:16-alpine
    container_name: devsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devsync_db
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: devsync_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: